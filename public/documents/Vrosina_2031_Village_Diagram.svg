<svg width="850" height="1200" viewBox="0 0 850 1200" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Η Βροσίνα ξαναζεί — τι αλλάζει στο χωριό μας</title>
<desc>Απλό εικαστικό σχεδιάγραμμα για παρουσίαση στην κοινότητα: έξι αλλαγές στο χωριό και τα βασικά νούμερα του σχεδίου.</desc>
<rect x="0" y="0" width="850" height="1200" fill="#FFFFFF"/>

<!-- HEADER -->
<rect x="0" y="0" width="850" height="175" fill="#1F3864"/>
<text x="425" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#FFFFFF">Η ΒΡΟΣΙΝΑ ΞΑΝΑΖΕΙ</text>
<text x="425" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-style="italic" fill="#E4C97A">Τι αλλάζει στο χωριό μας</text>

<!-- CARD TEMPLATE VALUES: col1 x=35 col2 x=435 width=380 height=225 -->
<!-- ROW 1 -->
<g>
<rect x="35" y="205" width="380" height="225" rx="14" fill="#F2F4F8"/>
<circle cx="225" cy="275" r="42" fill="#1F3864"/>
<path d="M225,250 L255,295 L195,295 Z" fill="#F4E7C1"/>
<circle cx="212" cy="280" r="4" fill="#1F3864"/>
<circle cx="232" cy="285" r="4" fill="#1F3864"/>
<circle cx="222" cy="270" r="3.5" fill="#1F3864"/>
<text x="225" y="345" text-anchor="middle" font-family="Calibri, sans-serif" font-size="21" font-weight="bold" fill="#1F3864">Το στρατόπεδο γίνεται</text>
<text x="225" y="373" text-anchor="middle" font-family="Calibri, sans-serif" font-size="21" font-weight="bold" fill="#1F3864">εργοστάσιο τυριού &amp; κρασιού</text>
<text x="225" y="404" text-anchor="middle" font-family="Calibri, sans-serif" font-size="15" fill="#5B6470">Δουλειά μέσα στο χωριό, όχι αλλού</text>
</g>

<g>
<rect x="435" y="205" width="380" height="225" rx="14" fill="#F2F4F8"/>
<circle cx="625" cy="275" r="42" fill="#8A6D1A"/>
<circle cx="612" cy="272" r="12" fill="#F4E7C1"/>
<circle cx="628" cy="265" r="12" fill="#F4E7C1"/>
<circle cx="638" cy="278" r="12" fill="#F4E7C1"/>
<circle cx="618" cy="286" r="12" fill="#F4E7C1"/>
<circle cx="634" cy="292" r="12" fill="#F4E7C1"/>
<path d="M626,252 L636,238 L646,250" stroke="#F4E7C1" stroke-width="4" fill="none" stroke-linecap="round"/>
<text x="625" y="345" text-anchor="middle" font-family="Calibri, sans-serif" font-size="21" font-weight="bold" fill="#1F3864">Νέοι βοσκοί &amp; αμπελουργοί</text>
<text x="625" y="373" text-anchor="middle" font-family="Calibri, sans-serif" font-size="21" font-weight="bold" fill="#1F3864">έρχονται να ζήσουν εδώ</text>
<text x="625" y="404" text-anchor="middle" font-family="Calibri, sans-serif" font-size="15" fill="#5B6470">Με ζώα, βοσκότοπο και σπίτι</text>
</g>

<!-- ROW 2 -->
<g>
<rect x="35" y="450" width="380" height="225" rx="14" fill="#F2F4F8"/>
<circle cx="225" cy="520" r="42" fill="#1F3864"/>
<path d="M197,530 L197,500 L225,478 L253,500 L253,530 Z" fill="#F4E7C1"/>
<rect x="215" y="510" width="20" height="20" fill="#1F3864"/>
<text x="225" y="590" text-anchor="middle" font-family="Calibri, sans-serif" font-size="21" font-weight="bold" fill="#1F3864">Τα κλειστά σπίτια</text>
<text x="225" y="618" text-anchor="middle" font-family="Calibri, sans-serif" font-size="21" font-weight="bold" fill="#1F3864">ανακαινίζονται</text>
<text x="225" y="649" text-anchor="middle" font-family="Calibri, sans-serif" font-size="15" fill="#5B6470">Με έξοδα του προγράμματος</text>
</g>

<g>
<rect x="435" y="450" width="380" height="225" rx="14" fill="#F2F4F8"/>
<circle cx="625" cy="520" r="42" fill="#8A6D1A"/>
<path d="M600,540 Q625,495 650,540" stroke="#F4E7C1" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M590,540 L660,540" stroke="#F4E7C1" stroke-width="6" stroke-linecap="round"/>
<path d="M598,548 Q625,558 652,548" stroke="#cfe3ef" stroke-width="5" fill="none" stroke-linecap="round"/>
<text x="625" y="590" text-anchor="middle" font-family="Calibri, sans-serif" font-size="21" font-weight="bold" fill="#1F3864">Το ποτάμι &amp; το γεφύρι</text>
<text x="625" y="618" text-anchor="middle" font-family="Calibri, sans-serif" font-size="21" font-weight="bold" fill="#1F3864">γίνονται μέρος περιπάτου</text>
<text x="625" y="649" text-anchor="middle" font-family="Calibri, sans-serif" font-size="15" fill="#5B6470">Μονοπάτι έως την Αγία Παρασκευή</text>
</g>

<!-- ROW 3 -->
<g>
<rect x="35" y="695" width="380" height="225" rx="14" fill="#F2F4F8"/>
<circle cx="225" cy="765" r="42" fill="#1F3864"/>
<path d="M205,780 L215,750 L235,750 L245,780 Z" fill="#F4E7C1"/>
<rect x="238" y="740" width="22" height="7" fill="#F4E7C1" transform="rotate(30 238 740)"/>
<text x="225" y="835" text-anchor="middle" font-family="Calibri, sans-serif" font-size="21" font-weight="bold" fill="#1F3864">Το παλιό σχολείο γίνεται</text>
<text x="225" y="863" text-anchor="middle" font-family="Calibri, sans-serif" font-size="21" font-weight="bold" fill="#1F3864">σχολή για μαστόρους πέτρας</text>
<text x="225" y="894" text-anchor="middle" font-family="Calibri, sans-serif" font-size="15" fill="#5B6470">Μαθαίνουν φτιάχνοντας τα ίδια τα σπίτια</text>
</g>

<g>
<rect x="435" y="695" width="380" height="225" rx="14" fill="#F2F4F8"/>
<circle cx="625" cy="765" r="42" fill="#8A6D1A"/>
<path d="M605,780 L605,755 Q605,745 625,745 Q645,745 645,760 L645,780 Z" fill="#F4E7C1"/>
<path d="M645,760 Q660,760 658,772 Q656,782 645,778" stroke="#F4E7C1" stroke-width="4" fill="none"/>
<path d="M615,738 Q612,730 616,724" stroke="#cfe3ef" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M628,738 Q625,730 629,724" stroke="#cfe3ef" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="625" y="835" text-anchor="middle" font-family="Calibri, sans-serif" font-size="21" font-weight="bold" fill="#1F3864">Τα καφενεία &amp; τα μαγαζιά</text>
<text x="625" y="863" text-anchor="middle" font-family="Calibri, sans-serif" font-size="21" font-weight="bold" fill="#1F3864">ξανανοίγουν</text>
<text x="625" y="894" text-anchor="middle" font-family="Calibri, sans-serif" font-size="15" fill="#5B6470">Δύο καφενεία, δωρεάν τα πρώτα 2 χρόνια</text>
</g>

<!-- NUMBERS BANNER -->
<rect x="0" y="945" width="850" height="160" fill="#8A6D1A"/>
<text x="150" y="1010" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#FFFFFF">80-100</text>
<text x="150" y="1042" text-anchor="middle" font-family="Calibri, sans-serif" font-size="17" fill="#F4E7C1">νέοι κάτοικοι</text>
<line x1="285" y1="975" x2="285" y2="1035" stroke="#c9a955" stroke-width="2"/>
<text x="425" y="1010" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#FFFFFF">50</text>
<text x="425" y="1042" text-anchor="middle" font-family="Calibri, sans-serif" font-size="17" fill="#F4E7C1">νέες δουλειές</text>
<line x1="565" y1="975" x2="565" y2="1035" stroke="#c9a955" stroke-width="2"/>
<text x="700" y="1010" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#FFFFFF">25</text>
<text x="700" y="1042" text-anchor="middle" font-family="Calibri, sans-serif" font-size="17" fill="#F4E7C1">σπίτια ξαναζούν</text>

<!-- FOOTER -->
<rect x="0" y="1105" width="850" height="95" fill="#1F3864"/>
<text x="425" y="1148" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#FFFFFF">Ένα χωριό που δουλεύει μαζί, ξαναζεί μαζί.</text>
<text x="425" y="1178" text-anchor="middle" font-family="Calibri, sans-serif" font-size="16" fill="#CFE0EE">Ελάτε στη συνέλευση να το συζητήσουμε όλοι μαζί.</text>
</svg>
